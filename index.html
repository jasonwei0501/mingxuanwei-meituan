);font-weight:500}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:26px}.tab{color:var(--muted);background:transparent;border-radius:0;padding:11px 2px;border-bottom:2px solid transparent;font-size:15px}.tab.active{color:var(--ink);border-color:var(--green);font-weight:600}.tab:hover{background:transparent;color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:24px}.panel,.card{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel{padding:22px;margin-bottom:20px}h2{font-size:18px;margin:0;font-weight:600}h3{font-size:16px;margin:0 0 8px;font-weight:600}.section-heading,.row,.side-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-heading{margin-bottom:17px}.side-heading{margin-bottom:16px}.filters{display:flex;align-items:end;gap:12px;padding:18px;background:white;border:1px solid var(--line);border-radius:9px;margin-bottom:24px}.filters label{flex:1}.filters label:first-child{flex:1.5}.field{display:block;font-size:13px;font-weight:500;margin-bottom:7px}input,select,textarea{width:100%;background:white;border:1px solid #dfe3eb;border-radius:5px;padding:9px 10px;color:var(--ink);min-width:0;font-size:14px}textarea{resize:vertical}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.destination{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}.destination strong{font-size:25px;font-weight:650;letter-spacing:1px}.destination span{font-size:13px;color:var(--muted)}.card-body{padding:14px 20px 18px}.card h3{font-size:15px;font-weight:500}.card .muted{font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px}.chip{font-size:12px;color:#717887;padding:2px 7px;background:#f3f4f7;border-radius:3px}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.price{font-size:21px;font-weight:600;letter-spacing:-.6px}.price small{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}.progress{height:3px;background:#eef0f5;margin-top:12px}.progress i{display:block;height:100%;background:#a4b6e9}.note{padding:15px 17px;border:1px solid #e8e3d3;background:#fffdf7;border-radius:7px;font-size:13px;color:#8a7b55}.note strong{display:block;margin-bottom:5px;font-weight:500}.steps{padding:0;margin:16px 0;list-style:none}.steps li{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line)}.step-number{display:grid;place-items:center;font-size:12px;width:22px;height:22px;background:#f1f3f9;border-radius:4px;flex-shrink:0;color:#7b84a0}.steps strong{font-size:14px;font-weight:500;display:block}.steps p{font-size:12px;color:var(--muted)}.full{width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:20px 0;background:white;border:1px solid var(--line);border-radius:7px}.stat{padding:16px 20px;border-right:1px solid var(--line);min-width:0}.stat:last-child{border-right:0}.stat strong{font-size:26px;font-weight:600;display:block;letter-spacing:-.6px;white-space:nowrap}.stat span{font-size:12px;color:var(--muted)}.panel .stat-grid{background:#fafbfe}.member{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.member:last-of-type{border-bottom:0}.member-name{font-size:14px;font-weight:500}.hint{font-size:12px;color:var(--muted);margin-top:12px}.destination-title{font-size:22px;margin:5px 0 10px}.itinerary{padding-left:0;margin:20px 0}.day{margin-bottom:28px}.day>h3{font-size:14px;color:#58627d;margin-bottom:12px}.day>h3 .muted{font-size:13px;margin-left:8px}.activity{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 20px;margin:0;background:white;border:1px solid var(--line);border-bottom:0}.activity:nth-child(2){border-radius:7px 7px 0 0}.activity:last-child{border-bottom:1px solid var(--line);border-radius:0 0 7 nslateX(-50%);background:#303644;color:white;border-radius:6px;padding:12px 20px;font-size:14px;z-index:20;max-width:90%}.todo-link{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:14px 0;font-size:14px}.todo-link button{font-size:13px;padding:0;color:var(--green);background:none}.team-summary{padding-top:2px}.team-summary>p{margin-top:5px}@media(max-width:860px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}aside .panel{margin:0}aside .note{grid-column:1/-1}.stat{padding:16px}.stat strong{font-size:24px}}@media(max-width:600px){header{padding:0 16px;height:60px}.brand small{display:none}.header-right{gap:5px}.header-right .badge{display:none}main{padding:24px 16px}.intro{align-items:flex-start}.intro h1{font-size:25px}.intro button{white-space:nowrap;padding:9px 12px}.tabs{gap:0;justify-content:space-between}.tab{font-size:14px;padding:10px 6px}.layout{gap:18px}.filters{flex-wrap:wrap;padding:14px;gap:10px}.filters label:first-child{flex-basis:100%}.cards{grid-template-columns:1fr}.panel{padding:18px}.stat{padding:12px 9px}.stat strong{font-size:21px}.stat span{font-size:12px}.section-heading{align-items:flex-start}.section-heading>button{white-space:nowrap}.destination-title{font-size:21px}.activity{padding:14px;align-items:flex-start}.activity h3{font-size:14px}aside{display:block}aside .panel,aside .note{margin-bottom:16px}.row{gap:8px}.member .subtle{padding:7px}.member .muted{font-size:12px}footer{flex-direction:column;gap:4px}.note{font-size:12px}.price{font-size:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="brand"><span class="logo">同</span><div>同路<small>毕业旅行</small></div></div><div class="header-right"><span class="badge">示例工作区</span><button class="subtle" onclick="openHelp()" aria-label="使用说明">使用说明</button><span class="avatar">我</span></div></header>
<main><div class="intro"><div><h1 id="pageTitle">毕业旅行</h1><p class="muted" id="pageSubtitle">行程、成员和账单，放在一起管理。</p></div><button onclick="openCreate()">＋ 发起拼团</button></div>
<nav class="tabs" aria-label="旅行工作区"><button class="tab active" data-tab="discover" onclick="switchTab('discover')">找旅伴</button><button class="tab" data-tab="team" onclick="switchTab('team')">成员与预算</button><button class="tab" data-tab="plan" onclick="switchTab('plan')">每日行程</button><button class="tab" data-tab="expense" onclick="switchTab('expense')">共同账单</button></nav>
<div id="view"></div><footer><span>同路 · 毕业旅行</span><span>示例数据 · 当前浏览器保存</span></footer></main>
<dialog id="modal"><div id="modalContent"></div></dialog><input class="file-input" id="importFile" type="file" accept="application/json,.json" aria-label="导入旅行备份"><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='graduation-together-v1';
const defaultGroups=[{id:'dali',city:'大理',title:'大理四天，骑行和古城逛吃',days:4,budget:1800,date:'2027-06-20',capacity:8,count:5,tags:['自然风光','慢节奏','毕业合照'],theme:'lake'},{id:'xiamen',city:'厦门',title:'厦门三天，海边散步看日落',days:3,budget:1500,date:'2027-06-22',capacity:6,count:4,tags:['海岛沙滩','美食','城市漫步'],theme:'sea'},{id:'chengdu',city:'成都',title:'成都四天，美食为主不赶路',days:4,budget:1600,date:'2027-06-24',capacity:8,count:6,tags:['美食','城市漫步','慢节奏'],theme:'city'},{id:'qingdao',city:'青岛',title:'青岛三天，沿海慢慢走',days:3,budget:1300,date:'2027-06-20',capacity:6,count:3,tags:['海岛沙滩','毕业合照','美食'],theme:'sea'}];
function initial(){return {groups:JSON.parse(JSON.stringify(defaultGroups)),selected:'dali',joined:false,members:[{id:'m1',name:'我',budget:2000},{id:'m2',name:'小林',budget:1800},{id:'m3',name:'阿宁',budget:2200},{id:'m4',name:'小周',budget:1800}],activities:[{id:'a1',day:1,time:'14:00',title:'集合入住，古城散步',note:'放下行李，先一起吃顿饭。',votes:[]},{id:'a2',day:2,time:'09:00',title:'洱海骑行与毕业合照',note:'轻松骑行，预留拍照和休息时间。',votes:['m2','m3']},{id:'a3',day:3,time:'10:00',title:'喜洲闲逛，寻找当地美食',note:'自由分组，傍晚一起看日落。',votes:['m4']},{id:'a4',day:4,time:'10:00',title:'写一张明信片，返程',note:'留半天机动时间，按各自交通安排出发。',votes:[]}],expenses:[{id:'e1',title:'民宿住宿',amount:120000,payer:'m2',participants:['m1','m2','m3','m4'],category:'住宿'},{id:'e2',title:'第一晚聚餐',amount:32000,payer:'m1',participants:['m1','m2','m3','m4'],category:'餐饮'},{id:'e3',title:'骑行租车',amount:18000,payer:'m3',participants:['m1','m2','m3'],category:'交通'}]};}
let state=initial(),tab='discover',filters={query:'',budget:'',tag:''};let storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);validate(parsed);state=parsed}}catch(e){storageOK=false;}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yuan=c=>(c/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const group=()=>state.groups.find(g=>g.id===state.selected);const name=id=>state.members.find(m=>m.id===id)?.name||'未知成员';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('浏览器无法保存，请导出备份保留修改。')}render()}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function switchTab(t){tab=t;render()}
function side(){const g=group(),total=state.expenses.reduce((n,e)=>n+e.amount,0);return `<aside><div class="panel"><div class="side-heading"><h3>这次旅行</h3><span class="badge">${state.joined?'已加入':'示例团'}</span></div><div class="team-summary"><h2>${esc(g.city)} · ${g.days}天${g.days-1}晚</h2><p class="muted">${esc(g.date)} 出发</p><div class="member">${state.members.slice(0,4).map(m=>`<span class="avatar" title="${esc(m.name)}">${esc(m.name.slice(0,1))}</span>`).join('')}<span class="muted">${state.members.length}人</span></div></div><div class="todo-link"><span>成员与预算</span><button onclick="switchTab('team')">查看</button></div><div class="todo-link"><span>${state.activities.length}项行程安排</span><button onclick="switchTab('plan')">查看</button></div><div class="todo-link"><span>共同支出 ¥${yuan(total)}</span><button onclick="switchTab('expense')">查看</button></div></div><div class="panel"><h3>把计划发给同学</h3><p class="muted">导出行程和账单，发到群里一起核对。</p><button class="secondary full" style="margin-top:15px" onclick="exportPlan()">导出旅行计划</button><div class="toolbar" style="margin-top:8px"><button class="subtle" onclick="exportData()">备份数据</button><button class="subtle" onclick="$('#importFile').click()">导入备份</button></div><p class="hint">文件分享，不会实时同步。</p></div><div class="note"><strong>预算先说清楚</strong>共同费用一起分，个人消费自己付。</div></aside>`}
function render(){const g=group();$('#pageTitle').textContent=tab==='discover'?'找个团，一起走':g.city+'毕业旅行';$('#pageSubtitle').textContent=tab==='discover'?'看看目的地、出发时间和预算，有合适的就一起商量。':g.date+' 出发 · '+g.days+'天'+(g.days-1)+'晚 · '+state.members.length+'位同学';document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('#view').innerHTML=tab==='discover'?discover():tab==='team'?team():tab==='plan'?plan():expenses();if(!storageOK)$('#view').insertAdjacentHTML('afterbegin','<p class="note">本地保存不可用，请导出备份保留修改。</p>')}
function discover(){const found=state.groups.filter(g=>(!filters.query||(g.city+g.title+g.tags.join('')).includes(filters.query))&&(!filters.budget||g.budget<=Number(filters.budget))&&(!filters.tag||g.tags.includes(filters.tag)));return `<div class="layout"><section><div class="filters"><label><span class="field">想去哪里？</span><input id="search" placeholder="搜索目的地或旅行关键词" value="${esc(filters.query)}" oninput="filterChange('query',this.value)"></label><label><span class="field">人均预算</span><select onchange="filterChange('budget',this.value)"><option value="">不限预算</option>${[1500,1800,2500].map(v=>`<option value="${v}" ${filters.budget==v?'selected':''}>¥${v} 以内</option>`).join('')}</select></label><label><span class="field">旅行偏好</span><select onchange="filterChange('tag',this.value)"><option value="">全部偏好</option>${['自然风光','海岛沙滩','美食','城市漫步','慢节奏','毕业合照'].map(t=>`<option ${filters.tag===t?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="section-heading"><h2>正在组队</h2><span class="muted">${found.length} 个旅行团</span></div><div class="cards">${found.map(g=>`<article class="card"><div class="destination"><strong>${esc(g.city)}</strong><span>${g.days}天${g.days-1}晚</span></div><div class="card-body"><h3>${esc(g.title)}</h3><p class="muted">${esc(g.date)} 出发 · ${g.days} 天 ${g.days-1} 晚</p><div class="chips">${g.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="row"><span class="muted">${g.count}/${g.capacity} 人 · ${g.count>=g.capacity?'已满员':'正在招募'}</span><span class="muted">${g.capacity-g.count} 个空位</span></div><div class="progress"><i style="width:${g.count/g.capacity*100}%"></i></div><div class="card-bottom"><span class="price">¥${g.budget}<small> / 人 · 预估</small></span><button ${g.count>=g.capacity&&state.selected!==g.id?'disabled':''} onclick="join('${g.id}')">${state.joined&&state.selected===g.id?'查看我的团':'查看并加入'}</button></div></div></article>`).join('')}</div>${found.length?'':`<div class="empty"><h3>暂时没有符合条件的团</h3><p>试试放宽预算或偏好，也可以自己发起一个。</p><button onclick="openCreate()">发起拼团</button></div>`}<p class="hint">示例团用于体验功能，价格为规划预算，不是实时旅游报价。</p></section>${side()}</div>`}
function filterChange(k,v){const focus=document.activeElement?.id;const start=document.activeElement?.selectionStart;filters[k]=v;render();if(focus==='search'){$('#search').focus();$('#search').setSelectionRange(start,start)}}
function team(){const g=group(),min=Math.min(...state.members.map(m=>m.budget));return `<div class="layout"><section><div class="panel"><div class="row"><div><span class="eyebrow">旅行信息</span><h2 class="destination-title">${esc(g.city)} · ${esc(g.title)}</h2><p class="muted">${esc(g.date)} 出发 · ${g.days} 天 · ${state.joined?'已加入旅行团':'示例规划，尚未加入'}</p></div><span class="badge">${state.members.length} 人同行</span></div><div class="chips">${g.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="stat-grid"><div class="stat"><span>团内最低预算上限</span><strong>¥${min}</strong></div><div class="stat"><span>预估人均预算</span><strong>¥${g.budget}</strong></div><div class="stat"><span>旅行天数</span><strong>${g.days}<small style="font-size:14px"> 天</small></strong></div></div><p class="${g.budget>min?'warning':'muted'}">${g.budget>min?'当前预估超过部分成员预算，建议调整共同开销。':'预估预算在所有成员的预算上限内，可以继续细化行程。'}</p><div class="toolbar" style="margin-top:18px"><button onclick="switchTab('plan')">一起定行程</button><button class="secondary" onclick="exportPlan()">导出旅行计划</button><button class="subtle" onclick="exportData()">备份数据</button></div></div><div class="panel"><div class="section-heading"><h2>同行成员</h2><button class="secondary" onclick="openMember()">＋ 添加旅伴</button></div>${state.members.map(m=>`<div class="member"><span class="avatar">${esc(m.name.slice(0,1))}</span><div style="flex:1"><div class="member-name">${esc(m.name)} ${m.id==='m1'?'<span class="chip">当前投票人</span>':''}</div><p class="muted">个人预算上限 ¥${m.budget}</p></div><button class="subtle" onclick="openMember('${m.id}')">编辑</button>${m.id==='m1'?'':`<button class="subtle danger" aria-label="删除${esc(m.name)}" onclick="removeMember('${m.id}')">移除</button>`}</div>`).join('')}<p class="hint">成员由组织者维护，示例昵称可以修改为你的同学。已参与账单的成员需先移除相关账单才能删除。</p></div></section>${side()}</div>`}
function plan(){const g=group(),voted=state.activities.filter(a=>a.votes.includes('m1')).length;return `<div class="layout"><section><div class="section-heading"><div><h2>${esc(g.city)} · 每日行程</h2><p class="muted">${g.days} 天行程 · 你已支持 ${voted} 项安排</p></div><button onclick="openActivity()">＋ 添加安排</button></div><div class="note">每项安排可独立投票。点击「支持」表示你的偏好，再次点击可以撤回；票数不代表已预订。</div><div class="itinerary">${Array.from({length:g.days},(_,i)=>i+1).map(day=>`<div class="day"><h3>第 ${day} 天 <span class="muted">${dayDate(g.date,day)}</span></h3>${state.activities.filter(a=>a.day===day).sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="activity"><div><span class="eyebrow">${esc(a.time)}</span><h3>${esc(a.title)}</h3><p class="muted">${esc(a.note)}</p><button class="subtle" style="padding:3px 0;font-size:12px" onclick="openActivity('${a.id}')">编辑安排</button></div><button class="vote ${a.votes.includes('m1')?'voted':''}" onclick="vote('${a.id}')">${a.votes.includes('m1')?'已支持':'支持'} · ${a.votes.length}</button></div>`).join('')||'<p class="muted">留点空间，添加大家想做的事。</p>'}</div>`).join('')}</div><button class="secondary" onclick="exportPlan()">导出行程与费用清单</button></section>${side()}</div>`}
function dayDate(date,day){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+day-1);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function split(e){const base=Math.floor(e.amount/e.participants.length),r=e.amount%e.participants.length;return e.participants.map((id,i)=>({id,cents:base+(i<r?1:0)}))}
function balances(){let b=Object.fromEntries(state.members.map(m=>[m.id,0]));state.expenses.forEach(e=>{b[e.payer]+=e.amount;split(e).forEach(s=>b[s.id]-=s.cents)});return b}
function settlements(){const b=balances(),receive=Object.entries(b).filter(x=>x[1]>0).map(x=>[...x]),pay=Object.entries(b).filter(x=>x[1]<0).map(x=>[x[0],-x[1]]),out=[];let i=0,j=0;while(i<pay.length&&j<receive.length){let amount=Math.min(pay[i][1],receive[j][1]);out.push({from:pay[i][0],to:receive[j][0],amount});pay[i][1]-=amount;receive[j][1]-=amount;if(!pay[i][1])i++;if(!receive[j][1])j++}return out}
function expenses(){const total=state.expenses.reduce((s,e)=>s+e.amount,0),g=group(),budget=g.budget*100*state.members.length,b=balances(),trans=settlements();return `<div class="layout"><section><div class="section-heading"><div><h2>共同账单</h2><p class="muted">只分摊共同消费，个人开销不记入团内账单。</p></div><button onclick="openExpense()">＋ 记一笔</button></div><div class="stat-grid"><div class="stat"><span>共同支出</span><strong>¥${yuan(total)}</strong></div><div class="stat"><span>平均支出 / 人</span><strong>¥${yuan(Math.round(total/state.members.length))}</strong></div><div class="stat"><span>账单笔数</span><strong>${state.expenses.length}</strong></div></div><div class="panel"><div class="row"><h3>共同预算使用</h3><span class="muted">${Math.round(total/budget*100)}%</span></div><div class="budget-bar"><i style="width:${Math.min(100,total/budget*100)}%;${total>budget?'background:#c8663d':''}"></i></div><p class="muted">${total>budget?'已超出共同预算':'剩余共同预算'} ¥${yuan(Math.abs(budget-total))} · 预算 ¥${yuan(budget)}</p></div><div class="panel"><h3>消费记录</h3><div class="table-wrap"><table><thead><tr><th>项目 / 分摊成员</th><th>垫付人</th><th>金额</th><th>操作</th></tr></thead><tbody>${state.expenses.map(e=>`<tr><td><strong>${esc(e.title)}</strong><p class="hint">${esc(e.category)} · ${e.participants.map(id=>esc(name(id))).join('、')}</p></td><td>${esc(name(e.payer))}</td><td>¥${yuan(e.amount)}</td><td><button class="subtle danger" onclick="deleteExpense('${e.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>${state.expenses.length?'':'<p class="muted" style="padding:20px 0">还没有共同支出，记下第一笔垫付吧。</p>'}</div><button class="secondary" onclick="exportPlan()">导出账单与结算方案</button></section><aside><div class="panel"><h3>待结算</h3><p class="muted">按实际参与人均分，自动合并转账。</p>${trans.map(t=>`<div class="settlement"><div class="row"><strong>${esc(name(t.from))} → ${esc(name(t.to))}</strong><strong>¥${yuan(t.amount)}</strong></div></div>`).join('')||'<div class="settlement">已平账，无需转账。</div>'}<p class="hint">这是待转账建议，不代表已经付款。金额精确到分，余下的分依次分配给参与人。</p></div><div class="panel"><h3>个人收支</h3>${state.members.map(m=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(m.name)}</span><span class="${b[m.id]<0?'warning':''}">${b[m.id]>0?'应收':b[m.id]<0?'应付':'已平'} ${b[m.id]?'¥'+yuan(Math.abs(b[m.id])):''}</span></div>`).join('')}<p class="hint">平均支出为概览；个人分摊以每笔账单参与人为准。</p></div><div class="note"><strong>账单不是付款</strong>无需充值，不收集银行卡。和同学核对后，通过你们常用的方式转账。</div></aside></div>`}
function modal(html){$('#modalContent').innerHTML=html;$('#modal').showModal()}function closeModal(){$('#modal').close()}
function actions(label='保存'){return `<div class="toolbar"><button type="button" class="secondary" onclick="closeModal()">取消</button><button type="submit">${label}</button></div>`}
function join(id){if(state.joined&&state.selected===id){switchTab('team');return}const g=state.groups.find(g=>g.id===id);modal(`<h2>加入${esc(g.city)}毕业旅行团</h2><p class="muted">${esc(g.date)} · ${g.days} 天 · 预估 ¥${g.budget}/人</p><p style="margin-top:14px">${state.selected!==id?'切换目的地会替换当前行程并清空当前账单；建议先导出备份。':'加入后可以维护成员、投票和记录费用。'}</p><p class="hint">这是交互原型，不会向真实旅行团发送报名。</p><div class="toolbar" style="margin-top:20px"><button class="secondary" onclick="exportData()">先备份</button><button class="secondary" onclick="closeModal()">取消</button><button onclick="confirmJoin('${id}')">确认加入</button></div>`)}
function makePlan(g){const titles=g.city==='大理'?['古城集合与散步','洱海骑行与毕业合照','喜洲闲逛与当地美食','写明信片，返程']:g.city==='厦门'?['集合入住，海边散步','街巷漫步与毕业合照','留半天自由活动，返程']:g.city==='成都'?['集合入住，巷子里吃晚饭','城市漫步与毕业合照','自由探索当地美食','写明信片，返程']:g.city==='青岛'?['集合入住，海岸散步','沿海漫步与毕业合照','自由活动，返程']:[];return Array.from({length:g.days},(_,i)=>({id:uid(),day:i+1,time:'10:00',title:titles[i]||(i===0?'集合入住':i===g.days-1?'自由活动与返程':'一起探索目的地'),note:'可按大家的想法编辑；出行前自行确认开放时间和预约。',votes:[]}))}
function confirmJoin(id){const g=state.groups.find(g=>g.id===id);if(state.selected!==id){if(state.joined){const old=group();old.count=Math.max(0,old.count-1)}state.activities=makePlan(g);state.expenses=[];state.members=state.members.slice(0,g.capacity);g.count++}else if(!state.joined){g.count++}state.selected=id;state.joined=true;closeModal();tab='team';save();toast('已加入，开始安排你们的旅行吧')}
function openCreate(){modal(`<h2>发起我们的毕业旅行</h2><form onsubmit="createGroup(event)"><label>旅行团名称<input name="title" required maxlength="40" placeholder="例如：大理四天，不赶路"></label><div class="form-grid"><label>目的地<input name="city" required maxlength="16" placeholder="城市名称"></label><label>出发日期<input name="date" type="date" value="2027-06-20" required min="2026-10-05" max="2099-12-01"></label><label>旅行天数<input name="days" type="number" min="1" max="14" value="3" required></label><label>人均预算（元）<input name="budget" type="number" min="100" max="100000" step="1" value="1500" required></label><label>人数上限<input name="capacity" type="number" min="2" max="30" value="8" required></label><label>主要偏好<select name="tag"><option>自然风光</option><option>海岛沙滩</option><option>美食</option><option>城市漫步</option><option>慢节奏</option></select></label></div><p class="hint">新团创建后会出现在找旅伴列表，可自行加入；当前规划会保留。</p>${actions('创建旅行团')}</form>`)}
function createGroup(e){e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim(),city=f.get('city').trim();if(!title||!city){toast('请填写有效的团名称和目的地');return}state.groups.unshift({id:uid(),title,city,date:f.get('date'),days:+f.get('days'),budget:+f.get('budget'),capacity:+f.get('capacity'),count:0,tags:[f.get('tag')],theme:f.get('tag')==='海岛沙滩'?'sea':'lake'});filters={query:'',budget:'',tag:''};tab='discover';closeModal();save();toast('旅行团已创建，可以从列表加入')}
function openMember(id){const m=state.members.find(m=>m.id===id);modal(`<h2>${m?'编辑':'添加'}旅伴</h2><form onsubmit="saveMember(event,'${id||''}')"><label>称呼<input name="name" maxlength="16" required value="${esc(m?.name||'')}" placeholder="同学的昵称"></label><label>个人预算上限（元）<input name="budget" type="number" min="1" max="100000" step="1" required value="${m?.budget||2000}"></label>${actions()}</form>`)}
function saveMember(e,id){e.preventDefault();const f=new FormData(e.target),n=f.get('name').trim();if(!n){toast('请输入有效称呼');return}const m=state.members.find(m=>m.id===id);if(!m&&state.members.length>=group().capacity){toast('已达到旅行团人数上限');return}if(m){m.name=n;m.budget=+f.get('budget')}else state.members.push({id:uid(),name:n,budget:+f.get('budget')});closeModal();save();toast('旅伴信息已保存')}
function removeMember(id){if(state.expenses.some(e=>e.payer===id||e.participants.includes(id))){toast('该成员有相关账单，请先删除相关账单');return}modal(`<h2>移除${esc(name(id))}？</h2><p>其行程投票也会移除。</p><div class="toolbar" style="margin-top:20px"><button class="secondary" onclick="closeModal()">取消</button><button onclick="confirmRemoveMember('${id}')">确认移除</button></div>`)}
function confirmRemoveMember(id){state.members=state.members.filter(m=>m.id!==id);state.activities.forEach(a=>a.votes=a.votes.filter(v=>v!==id));closeModal();save()}
function openActivity(id){const a=state.activities.find(a=>a.id===id);modal(`<h2>${a?'编辑':'添加'}行程安排</h2><form onsubmit="saveActivity(event,'${id||''}')"><div class="form-grid"><label>第几天<select name="day">${Array.from({length:group().days},(_,i)=>`<option value="${i+1}" ${a?.day===i+1?'selected':''}>第 ${i+1} 天</option>`).join('')}</select></label><label>开始时间<input name="time" type="time" value="${a?.time||'09:00'}" required></label></div><label>想做什么<input name="title" required maxlength="60" value="${esc(a?.title||'')}" placeholder="例如：去海边拍毕业照"></label><label>备注<textarea name="note" maxlength="200" rows="3" placeholder="集合点、需要预约的事项等">${esc(a?.note||'')}</textarea></label>${a?`<p class="hint">编辑内容后，该安排的已有投票会清零，请大家重新确认。</p><button type="button" class="subtle danger" onclick="deleteActivity('${id}')">删除这项安排</button>`:''}${actions()}</form>`)}
function saveActivity(e,id){e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim();if(!title){toast('请输入有效的安排名称');return}const data={day:+f.get('day'),time:f.get('time'),title,note:f.get('note').trim(),votes:[]},a=state.activities.find(a=>a.id===id);if(a)Object.assign(a,data);else state.activities.push({id:uid(),...data});closeModal();save();toast('行程安排已保存')}
function deleteActivity(id){state.activities=state.activities.filter(a=>a.id!==id);closeModal();save();toast('安排已删除')}
function vote(id){const a=state.activities.find(a=>a.id===id);if(a.votes.includes('m1'))a.votes=a.votes.filter(v=>v!=='m1');else a.votes.push('m1');save()}
function openExpense(){modal(`<h2>记一笔共同消费</h2><form onsubmit="saveExpense(event)"><label>消费项目<input name="title" required maxlength="40" placeholder="例如：第二晚聚餐"></label><div class="form-grid"><label>金额（元）<input name="amount" type="number" min="0.01" max="1000000" step="0.01" required placeholder="0.00"></label><label>分类<select name="category"><option>餐饮</option><option>住宿</option><option>交通</option><option>门票</option><option>其他</option></select></label></div><label>谁先垫付？<select name="payer">${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><span class="field">哪些人参与分摊？</span><div class="checks">${state.members.map(m=>`<label><input type="checkbox" name="participants" value="${m.id}" checked>${esc(m.name)}</label>`).join('')}</div><p class="hint">垫付人不一定需要参与；只勾选实际消费的同学。</p>${actions('保存账单')}</form>`)}
function saveExpense(e){e.preventDefault();const f=new FormData(e.target),participants=f.getAll('participants'),title=f.get('title').trim(),amount=Math.round(Number(f.get('amount'))*100);if(!participants.length){toast('至少选择一位分摊成员');return}if(!title||!Number.isSafeInteger(amount)||amount<=0){toast('请检查消费项目和金额');return}state.expenses.push({id:uid(),title,amount,payer:f.get('payer'),participants,category:f.get('category')});closeModal();save();toast('账单已记录，结算已更新')}
function deleteExpense(id){const e=state.expenses.find(e=>e.id===id);modal(`<h2>删除这笔账单？</h2><p>${esc(e.title)} · ¥${yuan(e.amount)}</p><p class="muted">删除后会重新计算所有人的应收应付。</p><div class="toolbar" style="margin-top:20px"><button class="secondary" onclick="closeModal()">取消</button><button onclick="confirmDeleteExpense('${id}')">确认删除</button></div>`)}
function confirmDeleteExpense(id){state.expenses=state.expenses.filter(e=>e.id!==id);closeModal();save();toast('账单已删除')}
function download(content,type,filename){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download(JSON.stringify(state,null,2),'application/json','同路-旅行备份.json');toast('已导出备份，导入可恢复完整规划')}
function exportPlan(){const g=group(),lines=[`同路 | ${g.city}毕业旅行`,g.title,`出发日期：${g.date}　天数：${g.days}　预估预算：¥${g.budget}/人`,'','同行成员：',...state.members.map(m=>`${m.name}：预算上限 ¥${m.budget}`),'','共同行程：',...state.activities.slice().sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time)).map(a=>`第${a.day}天 ${a.time} ${a.title}（${a.votes.length}票）\n${a.note}`),'','共同消费：',...state.expenses.map(e=>`${e.title}：¥${yuan(e.amount)}，${name(e.payer)}垫付\n分摊：${split(e).map(s=>`${name(s.id)} ¥${yuan(s.cents)}`).join('；')}`),'','结算建议（待转账）：',...settlements().map(t=>`${name(t.from)} → ${name(t.to)}：¥${yuan(t.amount)}`),'','说明：仅为规划记录，非预订或付款凭证。预算为估算，出行前确认交通、开放时间与价格。'];download('\ufeff'+lines.join('\n'),'text/plain;charset=utf-8','同路-旅行计划.txt');toast('旅行计划已导出')}
function validate(s){const str=(v,n)=>typeof v==='string'&&v.length>0&&v.length<=n,num=(v,min,max)=>Number.isInteger(v)&&v>=min&&v<=max;if(!s||!Array.isArray(s.groups)||!s.groups.length||s.groups.length>100||!Array.isArray(s.members)||!s.members.length||s.members.length>30||!Array.isArray(s.activities)||s.activities.length>300||!Array.isArray(s.expenses)||s.expenses.length>1000||typeof s.joined!=='boolean')throw Error('格式无效');const unique=a=>new Set(a.map(x=>x.id)).size===a.length;for(const a of [s.groups,s.members,s.activities,s.expenses])if(!unique(a))throw Error('重复标识');s.groups.forEach(g=>{if(!str(g.id,50)||!str(g.title,60)||!str(g.city,20)||!/^\d{4}-\d{2}-\d{2}$/.test(g.date)||Number.isNaN(new Date(g.date+'T12:00:00').getTime())||!num(g.days,1,14)||!num(g.budget,1,100000)||!num(g.capacity,2,30)||!num(g.count,0,g.capacity)||!Array.isArray(g.tags)||g.tags.length>10||!g.tags.every(t=>str(t,20))||!['sea','city','lake'].includes(g.theme))throw Error('旅行团无效')});const g=s.groups.find(g=>g.id===s.selected);if(!g)throw Error('没有选定旅行团');s.members.forEach(m=>{if(!str(m.id,50)||!str(m.name,16)||!num(m.budget,1,100000))throw Error('成员无效')});const ids=s.members.map(m=>m.id);if(!ids.includes('m1'))throw Error('缺少当前投票人');s.activities.forEach(a=>{if(!str(a.id,50)||!str(a.title,60)||typeof a.note!=='string'||a.note.length>200||!num(a.day,1,g.days)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(a.time)||!Array.isArray(a.votes)||!a.votes.every(id=>ids.includes(id))||new Set(a.votes).size!==a.votes.length)throw Error('行程无效')});s.expenses.forEach(e=>{if(!str(e.id,50)||!str(e.title,40)||!str(e.category,16)||!num(e.amount,1,100000000)||!ids.includes(e.payer)||!Array.isArray(e.participants)||!e.participants.length||!e.participants.every(id=>ids.includes(id))||new Set(e.participants).size!==e.participants.length)throw Error('账单无效')})}
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>2*1024*1024){toast('请选择小于 2MB 的旅行备份');return}try{const data=JSON.parse(await file.text());validate(data);window.pendingImport=data;modal(`<h2>导入旅行备份？</h2><p>将用「${esc(data.groups.find(g=>g.id===data.selected).title)}」替换当前规划。</p><p class="muted">建议先导出当前备份，避免丢失修改。</p><div class="toolbar" style="margin-top:20px"><button class="secondary" onclick="exportData()">先备份</button><button class="secondary" onclick="closeModal()">取消</button><button onclick="confirmImport()">确认导入</button></div>`)}catch(err){toast('备份格式不正确，未修改当前规划')}});
function confirmImport(){state=window.pendingImport;delete window.pendingImport;closeModal();tab='team';save();toast('备份已恢复')}
function openHelp(){modal(`<h2>使用说明</h2><ul class="steps"><li><span class="step-number">1</span><div><strong>找旅伴</strong><p>按目的地、预算和偏好筛选，加入或新建一个团。</p></div></li><li><span class="step-number">2</span><div><strong>统一行程</strong><p>维护旅伴预算，按天添加安排，用自己的身份投票。</p></div></li><li><span class="step-number">3</span><div><strong>公平分摊</strong><p>选垫付人与实际参与人，自动生成精确到分的结算。</p></div></li></ul><p class="muted" style="margin-top:15px">当前为无需登录的交互原型。示例团队不是实际招募；数据只保存在本机浏览器，不提供多人实时同步或真实预订。</p><p class="hint">关闭浏览器后数据仍保留（正常开启本地存储时）；清理浏览器数据会丢失，请定期导出备份。</p><div class="toolbar" style="margin-top:18px"><button class="secondary" onclick="openReset()">恢复示例</button><button onclick="closeModal()">开始规划</button></div>`)}
function openReset(){closeModal();modal(`<h2>恢复初始示例？</h2><p>将清除当前浏览器内的修改，请先备份重要规划。</p><div class="toolbar" style="margin-top:20px"><button class="secondary" onclick="exportData()">先备份</button><button class="secondary" onclick="closeModal()">取消</button><button onclick="resetState()">确认恢复</button></div>`)}
function resetState(){state=initial();closeModal();tab='discover';filters={query:'',budget:'',tag:''};save();toast('已恢复示例')}
render();
</script></body></html>
